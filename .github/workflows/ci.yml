name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check out the post-merge state on PRs so CI validates what will land on main,
# not just the branch tip. Falls back to the commit SHA on push/workflow_dispatch.
env:
  CHECKOUT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

jobs:
  # ── Path-change detection ─────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      shepherd-mcp: ${{ steps.filter.outputs.shepherd-mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shepherd-mcp:
              - 'shepherd-mcp/**'
              - '.github/workflows/ci.yml'

  # ── Python MCP server ─────────────────────────────────────────────────────────
  test-mcp:
    name: shepherd-mcp (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shepherd-mcp == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: shepherd-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  # ── CI Status gate (always runs, allows skipped jobs) ─────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test-mcp]
    if: always()
    steps:
      - name: Check CI results
        run: |
          if [[ "${{ needs.test-mcp.result }}" == "failure" ]]; then
            echo "CI checks failed"
            exit 1
          fi
          echo "All CI checks passed or were skipped"
